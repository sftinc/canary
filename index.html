<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>canary</title>
    <meta name="description" content="Proof that a push reached the server." />
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f5d200'/%3E%3C/svg%3E"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/bricolage-grotesque-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/ibm-plex-mono-latin.woff2"
      crossorigin
    />
  </head>
  <body class="font-display">
    <main class="mx-auto flex min-h-dvh w-full max-w-4xl flex-col px-6 py-8 sm:px-12 sm:py-12">
      <header>
        <span class="text-lg font-semibold tracking-tight">canary</span>
      </header>

      <div class="flex flex-1 flex-col justify-center py-10 sm:py-14">
        <h1
          id="marker"
          class="max-w-[14ch] text-[clamp(2.75rem,12.5vw,7rem)] font-extrabold leading-[0.88] tracking-[-0.035em] text-balance"
        >
          &nbsp;
        </h1>
      </div>

      <footer class="border-t pt-5" style="border-color: var(--rule)">
        <dl class="grid gap-2 text-[0.9375rem] sm:text-base">
          <div class="flex gap-5">
            <dt class="w-20 shrink-0 opacity-65">Age</dt>
            <dd id="age">&nbsp;</dd>
          </div>
          <div class="flex gap-5">
            <dt class="w-20 shrink-0 opacity-65">Commit</dt>
            <dd id="commit" class="font-mono">&nbsp;</dd>
          </div>
          <div class="flex gap-5">
            <dt class="w-20 shrink-0 opacity-65">Built</dt>
            <dd id="built" class="font-mono">&nbsp;</dd>
          </div>
        </dl>
        <p class="mt-6 max-w-[52ch] text-sm leading-relaxed opacity-65">
          If the marker above is not the one you just pushed, the chain is broken
          somewhere between the push and here.
        </p>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
